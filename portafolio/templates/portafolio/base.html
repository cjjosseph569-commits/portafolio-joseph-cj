{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portafolio de estudiante de desarrollo web: habilidades, proyectos y contacto.">
  <title>{{ titulo }} · Joseph Cj</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'portafolio/css/estilos.css' %}">
  <script src="{% static 'portafolio/js/main.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="{% url 'portafolio:inicio' %}" aria-label="Joseph Cj, inicio"><span class="brand-icon">&lt;/&gt;</span> Joseph Cj</a>
      <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="menu-principal" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav id="menu-principal" class="main-nav" aria-label="Navegación principal">
        <a href="{% url 'portafolio:inicio' %}" {% if request.resolver_match.url_name == 'inicio' %}aria-current="page"{% endif %}>Inicio</a>
        <a href="{% url 'portafolio:sobre_mi' %}" {% if request.resolver_match.url_name == 'sobre_mi' %}aria-current="page"{% endif %}>Sobre mí</a>
        <a href="{% url 'portafolio:habilidades' %}" {% if request.resolver_match.url_name == 'habilidades' %}aria-current="page"{% endif %}>Habilidades</a>
        <a href="{% url 'portafolio:proyectos' %}" {% if request.resolver_match.url_name == 'proyectos' %}aria-current="page"{% endif %}>Proyectos</a>
        <a class="nav-contact" href="{% url 'portafolio:contacto' %}" {% if request.resolver_match.url_name == 'contacto' %}aria-current="page"{% endif %}>Contacto <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="contenido">{% block contenido %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container footer-inner"><div><a class="brand" href="{% url 'portafolio:inicio' %}"><span class="brand-icon">&lt;/&gt;</span> Joseph Cj</a><p>Aprendiendo, creando y mejorando cada día.</p></div><nav aria-label="Enlaces del pie de página"><a href="{% url 'portafolio:proyectos' %}">Proyectos</a><a href="{% url 'portafolio:contacto' %}">Contacto</a></nav></div>
  </footer>
</body>
</html>
